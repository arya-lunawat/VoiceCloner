<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Clone Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07090d;
    --bg-2: #0b1117;
    --surface: rgba(17, 25, 32, .72);
    --surface-2: rgba(25, 36, 45, .78);
    --surface-3: rgba(35, 51, 63, .64);
    --glass: rgba(16, 26, 35, .58);
    --line: rgba(116, 238, 226, .18);
    --line-strong: rgba(136, 246, 234, .34);
    --text: #f4fbff;
    --muted: #9bb0bb;
    --muted-2: #6f838f;
    --teal: #38dfc4;
    --cyan: #73d7ff;
    --amber: #f5bd5d;
    --violet: #a78bfa;
    --rose: #ff7a86;
    --ink: #03110f;
    --shadow: 0 24px 80px rgba(0, 0, 0, .38);
    --glow: 0 0 28px rgba(56, 223, 196, .24);
    --display: "Space Grotesk", "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(56, 223, 196, .14), transparent 28%),
      radial-gradient(circle at 88% 12%, rgba(167, 139, 250, .14), transparent 26%),
      radial-gradient(circle at 72% 86%, rgba(245, 189, 93, .11), transparent 30%),
      linear-gradient(145deg, var(--bg), var(--bg-2) 52%, #080b12);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
  }
  body::before {
    opacity: .15;
    background-image:
      linear-gradient(115deg, transparent 0 42%, rgba(115, 215, 255, .55) 43%, transparent 44% 100%),
      linear-gradient(65deg, transparent 0 50%, rgba(56, 223, 196, .46) 51%, transparent 52% 100%),
      linear-gradient(155deg, transparent 0 56%, rgba(167, 139, 250, .44) 57%, transparent 58% 100%);
    background-size: 290px 210px, 360px 260px, 430px 280px;
    animation: meshDrift 24s linear infinite;
  }
  body::after {
    opacity: .18;
    background-image: linear-gradient(rgba(244, 251, 255, .045) 1px, transparent 1px);
    background-size: 100% 4px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 28px;
    border-bottom: 1px solid rgba(116, 238, 226, .16);
    background: rgba(7, 10, 14, .72);
    backdrop-filter: blur(18px);
    position: sticky;
    top: 0;
    z-index: 4;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .24);
  }
  .brand h1 {
    margin: 0;
    font: 700 24px/1.05 var(--display);
    letter-spacing: 0;
    text-shadow: 0 0 30px rgba(115, 215, 255, .22);
  }
  .brand span {
    display: block;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    margin-top: 4px;
  }
  nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
    transition: color .2s ease, border-color .2s ease, background .2s ease, transform .2s ease;
  }
  nav a:hover {
    color: var(--text);
    border-color: rgba(115, 215, 255, .22);
    background: rgba(115, 215, 255, .06);
  }
  nav a.active {
    color: var(--text);
    background: linear-gradient(135deg, rgba(56, 223, 196, .18), rgba(167, 139, 250, .12));
    border-color: var(--line-strong);
    box-shadow: inset 0 0 22px rgba(56, 223, 196, .08), var(--glow);
  }
  
  main {
    width: min(1100px, calc(100% - 36px));
    margin: 0 auto;
    padding: 34px 0 82px;
  }
  .page-head {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: end;
    margin-bottom: 22px;
  }
  .page-head h2 {
    margin: 0;
    font: 700 34px/1.08 var(--display);
    letter-spacing: 0;
  }
  .page-head p { margin: 7px 0 0; color: var(--muted); line-height: 1.45; max-width: 680px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .stack { display: grid; gap: 18px; }
  .panel, .card {
    background:
      linear-gradient(145deg, rgba(255, 255, 255, .075), transparent 36%),
      var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    position: relative;
    overflow: hidden;
  }
  .panel::before, .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(56, 223, 196, .16), transparent 28%, rgba(167, 139, 250, .1));
    opacity: .54;
  }
  .panel > *, .card > * { position: relative; z-index: 1; }
  .panel h3, .card h3 {
    font-family: var(--display);
    letter-spacing: 0;
  }
  label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 7px; }
  input[type=text], textarea, select {
    width: 100%;
    background: rgba(5, 12, 17, .62);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 11px 12px;
    font: 14px var(--sans);
    margin-bottom: 14px;
    outline: 0;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input[type=file] {
    width: 100%;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px;
    margin-bottom: 14px;
  }
  input[type=text]:focus, textarea:focus, select:focus, input[type=file]:focus, input[type=checkbox]:focus-visible, button:focus-visible, .button:focus-visible, nav a:focus-visible, .file-button:focus-visible {
    outline: 0;
    border-color: rgba(115, 215, 255, .72);
    box-shadow: 0 0 0 3px rgba(115, 215, 255, .14), 0 0 30px rgba(56, 223, 196, .16);
  }
  textarea { min-height: 210px; resize: vertical; line-height: 1.5; }
  button, .button {
    border: 1px solid rgba(115, 215, 255, .22);
    border-radius: 7px;
    padding: 11px 15px;
    background: linear-gradient(135deg, var(--teal), var(--cyan) 55%, var(--violet));
    color: var(--ink);
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    box-shadow: 0 10px 26px rgba(56, 223, 196, .18);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease, border-color .18s ease;
  }
  button:hover, .button:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
    box-shadow: 0 14px 34px rgba(56, 223, 196, .25);
  }
  button.secondary, .button.secondary {
    background: rgba(255, 255, 255, .045);
    color: var(--text);
    border: 1px solid var(--line);
    box-shadow: none;
  }
  button.danger {
    background: linear-gradient(135deg, var(--rose), #ffad7a);
    color: #250608;
    border-color: rgba(255, 122, 134, .42);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .file-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid rgba(115, 215, 255, .22);
    border-radius: 7px;
    padding: 11px 15px;
    background: linear-gradient(135deg, var(--teal), var(--cyan) 58%, var(--violet));
    color: var(--ink);
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    font-size: 14px;
    font-family: var(--sans);
    margin-bottom: 14px;
    box-shadow: 0 10px 26px rgba(56, 223, 196, .18);
  }
  .file-button:hover { filter: brightness(1.06); }
  .file-name {
    color: var(--muted);
    font-size: 13px;
    margin-left: 8px;
    font-family: var(--mono);
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .space { justify-content: space-between; }
  .status {
    min-height: 18px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    margin-top: 10px;
  }
  .status.ok { color: var(--teal); text-shadow: 0 0 18px rgba(56, 223, 196, .28); }
  .status.err { color: var(--rose); text-shadow: 0 0 18px rgba(255, 122, 134, .2); }
  .recorder {
    display: grid;
    place-items: center;
    min-height: 360px;
    text-align: center;
    background:
      radial-gradient(circle at 50% 38%, rgba(56, 223, 196, .16), transparent 34%),
      linear-gradient(145deg, rgba(255, 255, 255, .075), transparent 36%),
      var(--surface);
  }
  .mic {
    width: 136px;
    height: 136px;
    border-radius: 50%;
    font-size: 46px;
    margin-bottom: 18px;
    border: 1px solid rgba(115, 215, 255, .38);
    color: var(--text);
    background:
      radial-gradient(circle, rgba(244, 251, 255, .11), transparent 45%),
      conic-gradient(from 180deg, rgba(56, 223, 196, .34), rgba(115, 215, 255, .18), rgba(167, 139, 250, .32), rgba(245, 189, 93, .18), rgba(56, 223, 196, .34));
    box-shadow: inset 0 0 42px rgba(255, 255, 255, .07), 0 0 48px rgba(56, 223, 196, .22);
  }
  .mic.recording {
    background:
      radial-gradient(circle, rgba(255, 255, 255, .16), transparent 45%),
      conic-gradient(from 180deg, var(--rose), var(--amber), var(--teal), var(--rose));
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: inset 0 0 42px rgba(255, 255, 255, .08), 0 0 0 0 rgba(255, 122, 134, .48); }
    100% { box-shadow: inset 0 0 42px rgba(255, 255, 255, .08), 0 0 0 22px rgba(255, 122, 134, 0); }
  }
  .timer {
    font: 700 42px/1 var(--mono);
    margin-bottom: 18px;
    color: var(--cyan);
    text-shadow: 0 0 24px rgba(115, 215, 255, .24);
  }
  .hint { color: var(--muted); line-height: 1.5; }
  audio {
    width: 100%;
    margin-top: 12px;
    border-radius: 8px;
    filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .24));
  }
  .progress-wrap { display: none; margin-top: 14px; }
  .progress-bar {
    height: 10px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(116, 238, 226, .12);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 0 12px rgba(0, 0, 0, .3);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background:
      linear-gradient(90deg, transparent, rgba(255, 255, 255, .46), transparent),
      linear-gradient(90deg, var(--teal), var(--cyan), var(--amber));
    background-size: 42px 100%, 100% 100%;
    transition: width .25s ease;
    animation: shimmer 1.2s linear infinite;
    box-shadow: 0 0 18px rgba(115, 215, 255, .4);
  }
  .progress-label { color: var(--muted); font: 12px var(--mono); margin-top: 7px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 18px; }
  .meta { color: var(--muted); font: 12px var(--mono); margin-bottom: 12px; }
  .excerpt {
    color: var(--muted);
    line-height: 1.5;
    max-height: 72px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .empty {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 28px;
    color: var(--muted);
    text-align: center;
    background: rgba(255, 255, 255, .035);
    backdrop-filter: blur(14px);
  }
  .empty a { color: var(--cyan); }
  .voice-card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .voice-avatar {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    flex: 0 0 auto;
    border: 1px solid rgba(115, 215, 255, .28);
    box-shadow: 0 0 24px rgba(56, 223, 196, .18);
    overflow: hidden;
    background: rgba(255, 255, 255, .04);
  }
  .voice-card-head h3 { margin-bottom: 4px; }
  .audio-shell {
    border: 1px solid rgba(116, 238, 226, .16);
    border-radius: 8px;
    padding: 12px;
    background: rgba(5, 12, 17, .5);
  }

  .check { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 14px; }
  .check input { margin-top: 2px; accent-color: var(--teal); }
  footer { color: var(--muted); text-align: center; font-size: 12px; padding: 20px; }
  .burst {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 20;
    background: var(--cyan);
    box-shadow: 0 0 16px currentColor;
    animation: burst .62s ease-out forwards;
  }
  @keyframes meshDrift {
    from { background-position: 0 0, 0 0, 0 0; }
    to { background-position: 290px 210px, -360px 260px, 430px -280px; }
  }
  @keyframes shimmer {
    from { background-position: -42px 0, 0 0; }
    to { background-position: 42px 0, 0 0; }
  }
  @keyframes burst {
    from { opacity: .95; transform: translate(0, 0) scale(1); }
    to { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .001ms !important;
    }
  }
  @media (max-width: 760px) {
    header { align-items: flex-start; flex-direction: column; }
    nav { width: 100%; justify-content: stretch; }
    nav a { flex: 1; justify-content: center; }
    .grid { grid-template-columns: 1fr; }
    .page-head { display: block; }
    .page-head h2 { font-size: 29px; }
    main { width: min(100% - 24px, 1100px); padding-top: 22px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>VoiceCloner Studio</h1>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>


<script>
const API = "http://localhost:8000";
const app = document.getElementById("app");
const nav = document.getElementById("nav");

let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;
let recordedFileName = "recording.webm";
let timerId = null;
let seconds = 0;

const routes = {
  record: renderRecord,
  create: renderCreate,
  voices: renderVoices,
  library: renderLibrary,
};

const navItems = [
  ["record", "Mic", "Record"],
  ["create", "Spark", "Create"],
  ["voices", "Voices", "My Voices"],
  ["library", "Library", "Library"],
];

function icon(name) {
  const paths = {
    Mic: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/>',
    Spark: '<path d="m12 3 2.6 5.4L20 11l-5.4 2.6L12 19l-2.6-5.4L4 11l5.4-2.6Z"/>',
    Voices: '<path d="M16 11a4 4 0 1 0-8 0"/><path d="M4 21a8 8 0 0 1 16 0"/><path d="M19 8a3 3 0 0 1 0 6"/>',
    Library: '<path d="M4 4h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4Z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h6Z"/>',
  };
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;
}

function setStatus(id, message, kind = "") {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = message;
  el.className = `status ${kind}`.trim();
}

async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, options);
  const type = res.headers.get("content-type") || "";
  const data = type.includes("application/json") ? await res.json() : await res.text();
  if (!res.ok) {
    const detail = data && data.detail ? data.detail : data;
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return data;
}

function renderNav(current) {
  nav.innerHTML = navItems.map(([route, iconName, label]) =>
    `<a href="#${route}" class="${route === current ? "active" : ""}">${icon(iconName)}<span>${label}</span></a>`
  ).join("");
}

function router() {
  stopTimer();
  const hash = window.location.hash.slice(1) || "record";
  const [page, queryString = ""] = hash.split("?");
  const route = routes[page] ? page : "record";
  renderNav(route);
  routes[route](new URLSearchParams(queryString));
}

function pageHead(title, copy, action = "") {
  return `<div class="page-head"><div><h2>${title}</h2><p>${copy}</p></div>${action}</div>`;
}

function hashString(value) {
  return String(value ?? "").split("").reduce((hash, char) => {
    return ((hash << 5) - hash + char.charCodeAt(0)) | 0;
  }, 0);
}

function voiceAvatar(id) {
  const seed = Math.abs(hashString(id));
  const colors = ["#38dfc4", "#73d7ff", "#f5bd5d", "#a78bfa"];
  const stops = colors.map((color, index) => `<stop offset="${index * 33}%" stop-color="${color}" />`).join("");
  const bars = Array.from({ length: 13 }, (_, index) => {
    const height = 10 + ((seed >> (index % 8)) + index * 7) % 28;
    const x = 16 + index * 5;
    const y = 32 - height / 2;
    return `<rect x="${x}" y="${y}" width="2.7" height="${height}" rx="1.35" />`;
  }).join("");
  return `
    <svg class="voice-avatar" viewBox="0 0 88 88" role="img" aria-label="Voice waveform avatar">
      <defs>
        <linearGradient id="avatar-${seed}" x1="12" y1="12" x2="76" y2="76">${stops}</linearGradient>
      </defs>
      <circle cx="44" cy="44" r="40" fill="rgba(5, 12, 17, .78)" stroke="url(#avatar-${seed})" stroke-width="2" />
      <circle cx="44" cy="44" r="29" fill="none" stroke="url(#avatar-${seed})" stroke-width="1" opacity=".42" />
      <g fill="url(#avatar-${seed})">${bars}</g>
    </svg>
  `;
}

function audioShell(src, label = "Audio preview") {
  return `
    <div class="audio-shell" aria-label="${escapeHtml(label)}">
      <audio controls src="${escapeHtml(src)}"></audio>
    </div>
  `;
}

function particleBurst(source) {
  if (!source || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const rect = source.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;
  const colors = ["#38dfc4", "#73d7ff", "#f5bd5d", "#a78bfa", "#ff7a86"];
  Array.from({ length: 18 }, (_, index) => {
    const particle = document.createElement("span");
    const angle = (Math.PI * 2 * index) / 18;
    const distance = 42 + (index % 5) * 8;
    particle.className = "burst";
    particle.style.left = `${originX}px`;
    particle.style.top = `${originY}px`;
    particle.style.color = colors[index % colors.length];
    particle.style.setProperty("--tx", `${Math.cos(angle) * distance}px`);
    particle.style.setProperty("--ty", `${Math.sin(angle) * distance}px`);
    document.body.appendChild(particle);
    particle.addEventListener("animationend", () => particle.remove(), { once: true });
  });
}

function formatDate(value) {
  return value ? new Date(value).toLocaleString() : "Unknown date";
}

function formatTime(total) {
  const m = String(Math.floor(total / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function stopTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
}

function renderRecord() {
  recordedBlob = null;
  recordedFileName = "recording.webm";
  recordedChunks = [];
  app.innerHTML = `
    ${pageHead("Record or Upload a Voice", "Capture a clean sample or upload an existing audio file, preview it, then save it as a reusable voice in My Voices.")}
    <div class="grid">
      <section class="panel recorder">
        <div>
          <button class="mic" id="recordBtn" title="Start recording">${icon("Mic")}</button>
          <div class="timer" id="timer">00:00</div>
          <div class="row" style="justify-content:center">
            <button id="stopBtn" class="secondary" disabled>Stop</button>
            <button id="resetBtn" class="secondary" disabled>Clear sample</button>
          </div>
          <p class="hint">Use a quiet room and speak naturally. Thirty seconds or more gives the model better material.</p>
          <label style="text-align:left; margin-top:22px">Upload audio file</label>
          <input id="audioUpload" type="file" accept=".wav,.mp3,.flac,.m4a,.ogg,.webm,audio/*" hidden />
          <label for="audioUpload" class="file-button">Choose File</label>
          <span class="file-name" id="fileNameDisplay">No file chosen</span>
        </div>
      </section>
      <section class="panel">
        <label>Voice name</label>
        <input id="voiceName" type="text" placeholder="e.g. My narration voice" />
        <div class="check">
          <input type="checkbox" id="consent" />
          <span>I confirm I have the right to clone this voice and will not use generated audio to impersonate anyone without consent.</span>
        </div>
        <audio id="preview" controls style="display:none"></audio>
        <div class="row">
          <button id="saveBtn" disabled>Save Created Voice</button>
          <a href="#voices" class="button secondary">My Voices</a>
        </div>
        <div class="status" id="recordStatus"></div>
      </section>
    </div>
  `;

  document.getElementById("recordBtn").onclick = startRecording;
  document.getElementById("stopBtn").onclick = stopRecording;
  document.getElementById("resetBtn").onclick = resetRecording;
  document.getElementById("saveBtn").onclick = saveRecordedVoice;
  document.getElementById("audioUpload").onchange = handleAudioUpload;
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) recordedChunks.push(event.data);
    };
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      recordedFileName = "recording.webm";
      stream.getTracks().forEach(track => track.stop());
      const preview = document.getElementById("preview");
      preview.src = URL.createObjectURL(recordedBlob);
      preview.style.display = "block";
      document.getElementById("saveBtn").disabled = false;
      document.getElementById("resetBtn").disabled = false;
      setStatus("recordStatus", "Recording ready to save.", "ok");
    };
    mediaRecorder.start();
    seconds = 0;
    document.getElementById("timer").textContent = formatTime(seconds);
    timerId = setInterval(() => {
      seconds += 1;
      document.getElementById("timer").textContent = formatTime(seconds);
    }, 1000);
    document.getElementById("recordBtn").disabled = true;
    document.getElementById("recordBtn").classList.add("recording");
    document.getElementById("stopBtn").disabled = false;
    document.getElementById("audioUpload").disabled = true;
    particleBurst(document.getElementById("recordBtn"));
    setStatus("recordStatus", "Recording...");
  } catch (e) {
    setStatus("recordStatus", `Microphone unavailable: ${e.message}`, "err");
  }
}

function handleAudioUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById("fileNameDisplay").textContent = file.name;
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    stopRecording();
  }
  recordedBlob = file;
  recordedFileName = file.name || "uploaded-audio";
  recordedChunks = [];
  seconds = 0;
  document.getElementById("timer").textContent = "00:00";
  const preview = document.getElementById("preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  document.getElementById("saveBtn").disabled = false;
  document.getElementById("resetBtn").disabled = false;
  setStatus("recordStatus", `Uploaded "${recordedFileName}" and ready to save.`, "ok");
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  stopTimer();
  document.getElementById("recordBtn").disabled = false;
  document.getElementById("recordBtn").classList.remove("recording");
  document.getElementById("stopBtn").disabled = true;
  document.getElementById("audioUpload").disabled = false;
  particleBurst(document.getElementById("recordBtn"));
}

function resetRecording() {
  recordedBlob = null;
  recordedFileName = "recording.webm";
  recordedChunks = [];
  seconds = 0;
  document.getElementById("timer").textContent = "00:00";
  document.getElementById("preview").style.display = "none";
  document.getElementById("audioUpload").value = "";
  document.getElementById("audioUpload").disabled = false;
  document.getElementById("saveBtn").disabled = true;
  document.getElementById("resetBtn").disabled = true;
  document.getElementById("fileNameDisplay").textContent = "No file chosen";
  setStatus("recordStatus", "Ready for a fresh take.");
}

async function saveRecordedVoice() {
  const name = document.getElementById("voiceName").value.trim();
  const consent = document.getElementById("consent").checked;
  if (!recordedBlob || !name || !consent) {
    setStatus("recordStatus", "Record or upload audio, add a name, and confirm consent.", "err");
    return;
  }
  const form = new FormData();
  form.append("name", name);
  form.append("consent_confirmed", "true");
  form.append("audio", recordedBlob, recordedFileName);
  document.getElementById("saveBtn").disabled = true;
  setStatus("recordStatus", "Saving voice and computing speaker profile...");
  try {
    await apiFetch("/voice-profiles", { method: "POST", body: form });
    setStatus("recordStatus", "Voice saved to My Voices.", "ok");
    window.location.hash = "voices";
  } catch (e) {
    document.getElementById("saveBtn").disabled = false;
    setStatus("recordStatus", `Failed: ${e.message}`, "err");
  }
}

  app.innerHTML = `
    ${pageHead("Create Audio", "Choose a saved voice, type your script, generate speech, then download or save it to the library.")}
    <div class="grid">
      <section class="panel">
        <label>Voice</label>
        <select id="voiceSelect"></select>
        <label>Script</label>
        <textarea id="scriptText" placeholder="Type or paste the text you want spoken..."></textarea>
        <div class="check">
          <input type="checkbox" id="saveToLibrary" checked />
          <span>Save completed generation to My Library.</span>
        </div>
        <button id="generateBtn">Generate Voice</button>
        <div class="status" id="generateStatus"></div>
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-label" id="progressLabel"></div>
        </div>
      </section>
      <section class="panel">
        <h3 style="margin-top:0">Result</h3>
        <div id="playerShell" style="display:none">
          <div class="audio-shell">
            <div class="wave-strip" aria-hidden="true"></div>
            <audio id="player" controls></audio>
          </div>
        </div>
        <div class="row" id="downloadRow" style="display:none; margin-top:14px">
          <a id="downloadWav" class="button" download>Download WAV</a>
          <a id="downloadMp3" class="button secondary" download>Download MP3</a>
          <button id="saveGenerationBtn" class="secondary" style="display:none">Save to Library</button>
        </div>
        <p class="hint">Generated audio appears here when processing finishes.</p>
      </section>
    </div>
  `;

  try {
    const voices = await apiFetch("/voice-profiles?saved=true");
    const ready = voices.filter(v => v.status === "ready");
    const select = document.getElementById("voiceSelect");
    select.innerHTML = ready.length
      ? ready.map(v => `<option value="${v.id}">${escapeHtml(v.name)}</option>`).join("")
      : `<option value="">No saved voices yet</option>`;
    if (preselect) select.value = preselect;
    document.getElementById("generateBtn").disabled = ready.length === 0;
  } catch (e) {
    setStatus("generateStatus", `Could not load voices: ${e.message}`, "err");
  }
  document.getElementById("generateBtn").onclick = generateVoice;
}

async function generateVoice() {
  const voiceId = document.getElementById("voiceSelect").value;
  const text = document.getElementById("scriptText").value.trim();
  if (!voiceId || !text) {
    setStatus("generateStatus", "Pick a voice and enter text.", "err");
    return;
  }

  const form = new FormData();
  form.append("voice_profile_id", voiceId);
  form.append("text", text);
  form.append("language", "en");
  form.append("save_to_library", document.getElementById("saveToLibrary").checked ? "true" : "false");

  const btn = document.getElementById("generateBtn");
  const progressWrap = document.getElementById("progressWrap");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  btn.disabled = true;
  progressWrap.style.display = "block";
  progressFill.style.width = "0%";
  progressLabel.textContent = "Queued";
  setStatus("generateStatus", "Starting generation...");

  try {
    const started = await apiFetch("/generations", { method: "POST", body: form });
    let generationId = null;
    while (true) {
      await new Promise(resolve => setTimeout(resolve, 1500));
      const status = await apiFetch(`/generations/${started.job_id}/status`);
      const total = status.total_chunks || 0;
      const done = status.completed_chunks || 0;
      if (total > 0) {
        const pct = Math.min(100, Math.round((done / total) * 100));
        progressFill.style.width = `${pct}%`;
        progressLabel.textContent = `Chunk ${done} of ${total} (${pct}%)`;
      } else {
        progressLabel.textContent = status.progress || "Processing";
      }
      setStatus("generateStatus", status.progress || "Processing...");
      if (status.status === "completed") {
        generationId = status.generation_id;
        break;
      }
      if (status.status === "failed") throw new Error(status.error || "Generation failed");
    }

    const wavUrl = `${API}/generations/${started.job_id}/audio?format=wav`;
    const mp3Url = `${API}/generations/${started.job_id}/audio?format=mp3`;
    document.getElementById("player").src = wavUrl;
    document.getElementById("playerShell").style.display = "block";
    document.getElementById("downloadWav").href = wavUrl;
    document.getElementById("downloadMp3").href = mp3Url;
    document.getElementById("downloadRow").style.display = "flex";
    if (!document.getElementById("saveToLibrary").checked && generationId) {
      const saveBtn = document.getElementById("saveGenerationBtn");
      saveBtn.style.display = "inline-flex";
      saveBtn.onclick = async () => {
        await apiFetch(`/generations/${generationId}/save`, { method: "POST" });
        saveBtn.style.display = "none";
      };
    }
    progressFill.style.width = "100%";
    progressLabel.textContent = "Done";
    setStatus("generateStatus", "Generation complete.", "ok");
  } catch (e) {
    setStatus("generateStatus", `Failed: ${e.message}`, "err");
    progressLabel.textContent = "Error";
  } finally {
    btn.disabled = false;
  }
}

async function renderVoices() {
  app.innerHTML = `${pageHead("My Voices", "Saved voices are ready for reuse in the creator.", '<a class="button" href="#record">Record Voice</a>')}<div id="voicesRoot"></div>`;
  const root = document.getElementById("voicesRoot");
  try {
    const voices = await apiFetch("/voice-profiles?saved=true");
    if (!voices.length) {
      root.innerHTML = `<div class="empty">No voices saved yet. <a href="#record">Record your first voice</a>.</div>`;
      return;
    }
    root.innerHTML = `<div class="cards">${voices.map(v => `
      <article class="card">
        <div class="voice-card-head">
          ${voiceAvatar(v.id)}
          <div>
            <h3>${escapeHtml(v.name)}</h3>
            <div class="meta">${escapeHtml(v.status)} - ${formatDate(v.created_at)}</div>
          </div>
        </div>
        ${audioShell(`${API}/voice-profiles/${v.id}/recording`, `${v.name} source audio`)}
        <div class="row" style="margin-top:14px">
          <a class="button" href="#create?voice=${v.id}">Use in Creator</a>
          <button class="danger" data-delete-voice="${v.id}">Delete</button>
        </div>
      </article>
    `).join("")}</div>`;
    root.querySelectorAll("[data-delete-voice]").forEach(button => {
      button.onclick = async () => {
        button.disabled = true;
        await apiFetch(`/voice-profiles/${button.dataset.deleteVoice}`, { method: "DELETE" });
        renderVoices();
      };
    });
  } catch (e) {
    root.innerHTML = `<div class="status err">Failed: ${escapeHtml(e.message)}</div>`;
  }
}

async function renderLibrary() {
  app.innerHTML = `${pageHead("My Library", "Saved generations are collected here for replay and download.", '<a class="button" href="#create">Create Audio</a>')}<div id="libraryRoot"></div>`;
  const root = document.getElementById("libraryRoot");
  try {
    const items = await apiFetch("/library");
    if (!items.length) {
      root.innerHTML = `<div class="empty">No saved generations yet. <a href="#create">Generate your first voice</a>.</div>`;
      return;
    }
    root.innerHTML = `<div class="cards">${items.map(item => `
      <article class="card" data-generation-id="${escapeHtml(item.id)}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <h3 style="margin:0;flex:1" id="title-${escapeHtml(item.id)}">${escapeHtml(item.name || item.voice_name || "Voice")}</h3>
          <button class="rename-btn" data-rename-id="${escapeHtml(item.id)}" style="background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;min-height:unset;box-shadow:none;font-family:var(--sans)">Rename</button>
        </div>
        <div id="rename-input-${escapeHtml(item.id)}" style="display:none;margin-bottom:10px;">
          <div class="row">
            <input type="text" id="rename-field-${escapeHtml(item.id)}" value="${escapeHtml(item.name || item.voice_name || "Voice")}" style="flex:1;margin-bottom:0" />
            <button class="rename-save-btn" data-rename-id="${escapeHtml(item.id)}" style="padding:11px 12px;min-height:unset">Save</button>
            <button class="rename-cancel-btn" data-rename-id="${escapeHtml(item.id)}" class="secondary" style="padding:11px 12px;min-height:unset;background:rgba(255,255,255,.045);color:var(--text);border:1px solid var(--line);box-shadow:none">Cancel</button>
          </div>
        </div>
        <div class="meta">${formatDate(item.created_at)}</div>
        <div class="excerpt">${escapeHtml(item.text)}</div>
        ${audioShell(`${API}/generations/${item.id}/audio?format=wav`, `${item.name || item.voice_name || "Voice"} generated audio`)}
        <div class="row" style="margin-top:14px">
          <a class="button" href="${API}/generations/${item.id}/audio?format=mp3">Download MP3</a>
          <button class="secondary" data-remove-generation="${item.id}">Remove</button>
        </div>
      </article>
    `).join("")}</div>`;

    // Rename button click: show input
    root.querySelectorAll(".rename-btn").forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.renameId;
        document.getElementById(`title-${id}`).style.display = "none";
        btn.style.display = "none";
        document.getElementById(`rename-input-${id}`).style.display = "block";
        document.getElementById(`rename-field-${id}`).focus();
        document.getElementById(`rename-field-${id}`).select();
      };
    });

    // Rename save
    root.querySelectorAll(".rename-save-btn").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.renameId;
        const field = document.getElementById(`rename-field-${id}`);
        const name = field.value.trim();
        if (!name) return;
        btn.disabled = true;
        try {
          await apiFetch(`/library/${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
          });
          renderLibrary();
        } catch (e) {
          setStatus("libraryStatus", `Rename failed: ${e.message}`, "err");
          btn.disabled = false;
        }
      };
    });

    // Rename cancel
    root.querySelectorAll(".rename-cancel-btn").forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.renameId;
        document.getElementById(`title-${id}`).style.display = "block";
        document.querySelector(`.rename-btn[data-rename-id="${id}"]`).style.display = "";
        document.getElementById(`rename-input-${id}`).style.display = "none";
      };
    });

    // Remove
    root.querySelectorAll("[data-remove-generation]").forEach(button => {
      button.onclick = async () => {
        button.disabled = true;
        await apiFetch(`/library/${button.dataset.removeGeneration}`, { method: "DELETE" });
        renderLibrary();
      };
    });
  } catch (e) {
    root.innerHTML = `<div class="status err">Failed: ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

window.addEventListener("hashchange", router);
window.addEventListener("load", router);
</script>
